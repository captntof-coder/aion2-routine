name = "aion2-routine"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*"]

[[d1_databases]]
binding = "DB"
database_name = "aion2-routine-db"
database_id = "85eebaa9-9b04-4114-b0d4-1d9c90dff3eb"
migrations_dir = "migrations"

[vars]
PUBLIC_ORIGIN = "https://aion2-routine.captntof.workers.dev"
# Remplacer par l'Application ID Discord, identifiant public
DISCORD_CLIENT_ID = ""

# DISCORD_CLIENT_SECRET est un secret Cloudflare : ne jamais l'écrire ici.
